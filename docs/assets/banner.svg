<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Practice Skills by Yasir Jilani</title>
  <desc id="desc">An independent library of 587 agent skills for business and professional practice.</desc>
  <rect width="1200" height="420" fill="#0c1c2e"/>
  <rect x="0" y="0" width="14" height="420" fill="#c4a46b"/>
  <circle cx="1040" cy="78" r="120" fill="#14344c"/>
  <circle cx="980" cy="150" r="46" fill="none" stroke="#c4a46b" stroke-width="2"/>
  <path d="M80 92h180" stroke="#c4a46b" stroke-width="2"/>
  <text x="80" y="78" fill="#c4a46b" font-family="Georgia, Palatino, serif" font-size="18" letter-spacing="3">YASIR JILANI</text>
  <text x="80" y="168" fill="#f6f1e7" font-family="Georgia, Palatino, serif" font-size="68">Practice Skills</text>
  <text x="80" y="214" fill="#d7e4ea" font-family="Georgia, Palatino, serif" font-size="26">587 workflows for Claude and any Agent Skills client</text>
  <text x="80" y="268" fill="#9fb3c0" font-family="Georgia, Palatino, sans-serif" font-size="18">Strategy, finance, delivery, clinic operations, the shop floor, and the work between.</text>
  <g font-family="Georgia, sans-serif" font-size="15" fill="#f6f1e7">
    <rect x="80" y="312" width="150" height="42" rx="21" fill="#1f7a72"/>
    <text x="155" y="338" text-anchor="middle">48 domains</text>
    <rect x="246" y="312" width="170" height="42" rx="21" fill="#14344c" stroke="#c4a46b"/>
    <text x="331" y="338" text-anchor="middle">Install by domain</text>
    <rect x="432" y="312" width="150" height="42" rx="21" fill="#14344c" stroke="#c4a46b"/>
    <text x="507" y="338" text-anchor="middle">No telemetry</text>
  </g>
  <text x="80" y="392" fill="#8aa0ad" font-family="Georgia, sans-serif" font-size="14">Independent library. Not affiliated with Anthropic. MIT License.</text>
</svg>
